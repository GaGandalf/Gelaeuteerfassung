name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android-SDK prüfen (auf GitHub vorinstalliert)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx --yes @capacitor/assets generate --android || echo "Icons: Standard wird verwendet"
          npx cap sync android
      - name: Mikrofon-Berechtigung (für Aufnahmen)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' $M
          grep -n "uses-permission" $M
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gelaeut-Erfassung.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gelaeut-Erfassung-APK
          path: Gelaeut-Erfassung.apk
      - name: Als Download (Release) bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Geläut-Erfassung – Android-App
          body: Neueste Android-App. Auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben).
          files: Gelaeut-Erfassung.apk
          make_latest: true
